<!doctype html><html><head><meta charset="utf-8"><title>3D contact sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito:wght@700&display=swap">
<style>body{background:#012D12;color:#cfe3d5;font:12px Nunito,sans-serif;margin:10px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,5),var(--w,200px));gap:8px}.cell{border:1px solid rgba(124,196,238,.25);padding:4px}
.cell b{display:block;color:#7CC4EE;margin-bottom:2px}.h{width:100%;height:var(--h,150px);position:relative;background:radial-gradient(120% 90% at 50% 35%,#fff 0,#eef0ee 60%,#e2e6e3 100%);border-radius:8px;overflow:hidden}
.h canvas{width:100%;height:100%;display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
</head>
<body><div class="grid" id="g"></div>
<script src="../js/figure.js"></script><script src="../js/exercises.js"></script><script src="../js/figure3d.js"></script>
<script type="module">
// Every exercise's key poses on the 3D coach, for checking animations.
//   ?ids=squat,push-up   ?from=0&to=20   ?keys=3   ?mode=muscle|map   ?note=0   ?w=260&h=200&cols=4   ?coach=f
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/jsm/GLTFLoader.js';
import { RoomEnvironment } from '../vendor/jsm/RoomEnvironment.js';
window.THREE = THREE; window.WBF_GLTF = GLTFLoader; window.WBF_ROOM = RoomEnvironment; window.WBF_COACH = '../assets/coach-' + (new URLSearchParams(location.search).get('coach') || 'm') + '.glb';
const q = new URLSearchParams(location.search), g = document.getElementById('g');
['w', 'h', 'cols'].forEach((k) => { if (q.get(k)) document.documentElement.style.setProperty('--' + k, k === 'cols' ? q.get(k) : q.get(k) + 'px'); });
function draw() {
  const ids = q.get('ids') ? q.get('ids').split(',') : Object.keys(WBF.EX).slice(+(q.get('from') || 0), +(q.get('to') || 999));
  const note = q.get('note') !== '0', mode = q.get('mode') || 'demo';
  for (const id of ids) {
    const ex = WBF.EX[id], an = ex.anim;
    const keys = an.k.map((_, i) => i).slice(0, an.wrap ? an.k.length - 1 : (+q.get('keys') || 2));
    for (const ki of keys) {
      const c = document.createElement('div'); c.className = 'cell';
      c.innerHTML = '<b>' + ex.name + ' · ' + ki + '</b><div class="h"></div>';
      g.appendChild(c);
      new WBF.fig3d.Figure(an, { note, mode, yaw: q.get('yaw') != null ? +q.get('yaw') : undefined, pitch: q.get('pitch') != null ? +q.get('pitch') : undefined }).mount(c.querySelector('.h')).still(ki);
    }
  }
  document.title = 'done';
}
window.addEventListener('wbf-three', () => { if (WBF.fig3d.init() && document.title !== 'done') draw(); });
if (WBF.fig3d.init()) draw();
setTimeout(() => { if (document.title !== 'done') document.title = 'nogl'; }, 60000);
</script></body></html>
