<!doctype html><html><head><meta charset="utf-8"><title>3D pick</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito:wght@700&display=swap">
<style>body{background:#012D12;color:#cfe3d5;font:12px Nunito,sans-serif;margin:10px}
.grid{display:grid;grid-template-columns:repeat(5,200px);gap:8px}.cell{border:1px solid rgba(124,196,238,.25);padding:4px}
.cell b{display:block;color:#7CC4EE;margin-bottom:2px}.h{width:100%;height:150px;position:relative}.h canvas{width:100%;height:100%;display:block}</style></head>
<body><div class="grid" id="g"></div>
<script src="../js/figure.js"></script><script src="../js/exercises.js"></script><script src="../js/figure3d.js"></script>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
window.THREE = THREE; WBF.fig3d.init();
const ids = new URLSearchParams(location.search).get('ids').split(',');
const g = document.getElementById('g');
for (const id of ids) for (const ki of [0, 1]) {
  const c = document.createElement('div'); c.className = 'cell';
  c.innerHTML = '<b>' + WBF.EX[id].name + ' · ' + ki + '</b><div class="h"></div>'; g.appendChild(c);
  new WBF.fig3d.Figure(WBF.EX[id].anim, { note: true }).mount(c.querySelector('.h')).still(ki);
}
document.title = 'done';
</script></body></html>
