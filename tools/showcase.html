<!doctype html><html><head><meta charset="utf-8"><title>showcase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito:wght@800;900&display=swap">
<style>body{background:#012D12;margin:0;padding:22px;width:1040px;font-family:Nunito,sans-serif}
h1{font:900 34px/1 Nunito;color:#7CC4EE;text-transform:uppercase;margin:0 0 6px}p.s{font:20px 'Gilda Display',serif;color:#A9DCF8;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{background:#053A1B;border:1px solid rgba(124,196,238,.18);border-radius:16px;padding:10px}
.c b{display:block;font:900 15px Nunito;color:#7CC4EE;text-transform:uppercase;margin:2px 4px 6px}.h{height:190px;position:relative}.h canvas{width:100%;height:100%;display:block}</style></head>
<body><h1>Wellness by Frank · 3D coach</h1><p class="s">Every move shown by a moving figure. The muscles it works light up.</p><div class="grid" id="g"></div>
<script src="../js/figure.js"></script><script src="../js/exercises.js"></script><script src="../js/figure3d.js"></script>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
window.THREE = THREE; WBF.fig3d.init();
const picks = [['squat',1],['push-up',1],['bird-dog',1],['split-squat',1],['single-leg-rdl',1],['side-plank',0],['ring-row',1],['goblet-squat',1],['jumping-jacks',1],['glute-bridge',1],['donkey-kick',1],['db-press',1]];
const g = document.getElementById('g');
for (const [id, k] of picks) { const c = document.createElement('div'); c.className = 'c'; c.innerHTML = '<b>' + WBF.EX[id].name + '</b><div class="h"></div>'; g.appendChild(c);
  new WBF.fig3d.Figure(WBF.EX[id].anim, { note: true }).mount(c.querySelector('.h')).still(k); }
document.title = 'done';
</script></body></html>
