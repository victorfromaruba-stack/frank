<!doctype html>
<html><head><meta charset="utf-8"><title>coach render</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}#h{position:fixed;inset:0}#h canvas{position:absolute;inset:0;width:100%;height:100%;display:block}</style></head>
<body><div id="h"></div>
<!-- One exercise pose by the 3D coach, filling the page, on a transparent background.
     ?ex=squat&key=1&coach=f&mode=demo|muscle&yaw=40&pitch=8&note=1&t=0.3&zoom=0.8&fade=0.05&noteSize=40&noteInk=%23A9DCF8&noteHalo=0
     (used by scripts/coach.cjs) -->
<script src="/js/figure.js"></script>
<script src="/js/exercises.js"></script>
<script src="/js/figure3d.js"></script>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/vendor/jsm/GLTFLoader.js';
import { RoomEnvironment } from '/vendor/jsm/RoomEnvironment.js';
window.THREE = THREE; window.WBF_GLTF = GLTFLoader; window.WBF_ROOM = RoomEnvironment;
const q = new URLSearchParams(location.search);
// whatever reaches the edge (a long floor shadow) fades out instead of ending in a hard line
function fadeEdges(c, frac) {
  const w = c.width, h = c.height, m = Math.round(Math.min(w, h) * frac);
  if (m < 2) return;
  const ctx = c.getContext('2d'), img = ctx.getImageData(0, 0, w, h), d = img.data;
  const ramp = (v) => (v >= m ? 1 : (v / m) * (v / m) * (3 - 2 * v / m));
  for (let y = 0; y < h; y++) {
    const fy = Math.min(ramp(y), ramp(h - 1 - y));
    for (let x = 0; x < w; x++) {
      const k = Math.min(fy, ramp(x), ramp(w - 1 - x));
      if (k < 1) d[(y * w + x) * 4 + 3] *= k;
    }
  }
  ctx.putImageData(img, 0, 0);
}
const num = (k) => (q.get(k) != null && q.get(k) !== '' ? +q.get(k) : undefined);
try {
  const ex = WBF.EX[q.get('ex')];
  if (!ex) throw new Error('no exercise called ' + q.get('ex'));
  const coach = q.get('coach') === 'f' ? 'f' : 'm';
  WBF.fig3d.init();
  WBF.fig3d.setCoach(coach);
  const t0 = Date.now();
  while (!(WBF.fig3d.ready() && WBF.fig3d.coach() === coach)) {
    if (Date.now() - t0 > 120000) throw new Error('the 3D coach did not load');
    WBF.fig3d.init(); WBF.fig3d.setCoach(coach);
    await new Promise((r) => setTimeout(r, 100));
  }
  const keys = ex.anim.k.length - (ex.anim.wrap ? 1 : 0);
  const key = Math.max(0, Math.min(keys - 1, num('key') != null ? num('key') : (ex.type === 'time' ? 0 : 1)));
  const t = num('t');                               // a moment between key poses: 0..1 through the movement
  const f = new WBF.fig3d.Figure(ex.anim, { note: q.get('note') === '1', mode: q.get('mode') || 'demo', yaw: num('yaw'), pitch: num('pitch'),
                                           fitKey: q.get('fit') === 'move' || t != null ? undefined : key, mat: q.get('mat') !== '0',
                                           zoom: num('zoom'), noteSize: num('noteSize'), noteInk: q.get('noteInk') || undefined,
                                           noteHalo: q.get('noteHalo') === '0' ? false : undefined });
  f.mount(document.getElementById('h'));
  if (t != null) f.draw(WBF.fig.sample(ex.anim, Math.max(0, Math.min(1, t)) * WBF.fig.cycle(ex.anim)));
  else f.still(key);
  fadeEdges(f.canvas, num('fade') != null ? num('fade') : 0.05);
  document.title = 'done ' + (t != null ? 't' + t : key) + '/' + keys;
} catch (e) {
  document.title = 'error: ' + e.message;
}
</script>
</body></html>
